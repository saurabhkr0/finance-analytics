name: Scheduled Health Check

on:
  #schedule:
    # Scheduled runs disabled — trigger manually for demos
    # Every Monday at 6:00 AM AEST (Sunday 8:00 PM UTC)
    # - cron: '0 20 * * 0'
  workflow_dispatch:  # Manual trigger for testing

permissions:
  contents: write

jobs:
  health-check:
    name: Run Platform Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js (for MCP servers)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Cortex Code CLI
        run: |
          curl -LsS https://ai.snowflake.com/static/cc-scripts/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Cortex Code CLI
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cortex --version

      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/connections.toml << TOML
          [default]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          authenticator = "PROGRAMMATIC_ACCESS_TOKEN"
          token = "${{ secrets.SNOWFLAKE_PAT }}"
          warehouse = "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          role = "${{ secrets.SNOWFLAKE_ROLE }}"
          TOML

      - name: Configure Cortex Code settings
        run: |
          mkdir -p ~/.snowflake/cortex
          echo '{"autoUpdate": false}' > ~/.snowflake/cortex/settings.json

      - name: Configure MCP servers
        run: |
          mkdir -p ~/.snowflake/cortex
          cat > ~/.snowflake/cortex/mcp.json << 'MCPJSON'
          {
            "mcpServers": {
              "github": {
                "type": "stdio",
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-github"],
                "env": {
                  "GITHUB_PERSONAL_ACCESS_TOKEN": "${{ secrets.GH_PAT_TOKEN }}"
                }
              },
              "jira": {
                "type": "stdio",
                "command": "npx",
                "args": ["-y", "@aashari/mcp-server-atlassian-jira"],
                "env": {
                  "ATLASSIAN_SITE_NAME": "${{ secrets.ATLASSIAN_SITE_NAME }}",
                  "ATLASSIAN_USER_EMAIL": "${{ secrets.ATLASSIAN_USER_EMAIL }}",
                  "ATLASSIAN_API_TOKEN": "${{ secrets.ATLASSIAN_API_TOKEN }}"
                }
              },
              "slack": {
                "type": "stdio",
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-slack"],
                "env": {
                  "SLACK_BOT_TOKEN": "${{ secrets.SLACK_BOT_TOKEN }}",
                  "SLACK_TEAM_ID": "${{ secrets.SLACK_TEAM_ID }}"
                }
              }
            }
          }
          MCPJSON

      - name: Run health check swarm
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cortex exec \
            --file .cortex/prompts/health-check-swarm.md \
            -c default \
            --bypass \
            --model claude-sonnet-4-5 \
            --effort medium \
            --max-turns 50 \
            --no-history \
            -o reports/swarm_summary.md
        timeout-minutes: 30

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: health-check-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Commit updated reports
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "chore: update health check reports [skip ci]"
            git push
          fi
