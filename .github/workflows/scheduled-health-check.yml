name: Scheduled Health Check

on:
  # Scheduled runs disabled — trigger manually for demos
  # schedule:
  #   - cron: '0 20 * * 0'   # Every Monday 6:00 AM AEST (Sunday 8:00 PM UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-check:
    name: Run Platform Health Check
    runs-on: ubuntu-latest

    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
      ATLASSIAN_SITE_NAME: ${{ secrets.ATLASSIAN_SITE_NAME }}
      ATLASSIAN_USER_EMAIL: ${{ secrets.ATLASSIAN_USER_EMAIL }}
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js (for MCP servers)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Cortex Code CLI
        run: |
          curl -LsS https://ai.snowflake.com/static/cc-scripts/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Cortex Code CLI
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cortex --version

      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/connections.toml << TOML
          [default]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          authenticator = "PROGRAMMATIC_ACCESS_TOKEN"
          token = "${{ secrets.SNOWFLAKE_PAT }}"
          warehouse = "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          role = "${{ secrets.SNOWFLAKE_ROLE }}"
          TOML

      - name: Configure Cortex Code settings
        run: |
          mkdir -p ~/.snowflake/cortex
          echo '{"autoUpdate": false}' > ~/.snowflake/cortex/settings.json

      - name: Configure MCP servers
        run: |
          mkdir -p ~/.snowflake/cortex
          cat > ~/.snowflake/cortex/mcp.json << 'MCPJSON'
          {
            "mcpServers": {
              "github": {
                "type": "stdio",
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-github"],
                "env": {
                  "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_PERSONAL_ACCESS_TOKEN}"
                }
              },
              "jira": {
                "type": "stdio",
                "command": "npx",
                "args": ["-y", "@aashari/mcp-server-atlassian-jira"],
                "env": {
                  "ATLASSIAN_SITE_NAME": "${ATLASSIAN_SITE_NAME}",
                  "ATLASSIAN_USER_EMAIL": "${ATLASSIAN_USER_EMAIL}",
                  "ATLASSIAN_API_TOKEN": "${ATLASSIAN_API_TOKEN}"
                }
              },
              "slack": {
                "type": "stdio",
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-slack"],
                "env": {
                  "SLACK_BOT_TOKEN": "${SLACK_BOT_TOKEN}",
                  "SLACK_TEAM_ID": "${SLACK_TEAM_ID}"
                }
              }
            }
          }
          MCPJSON

      - name: Configure MCP permissions
        run: |
          mkdir -p ~/.snowflake/cortex
          cat > ~/.snowflake/cortex/permissions.json << PERMJSON
          {
            "$GITHUB_WORKSPACE": {
              "mcp__github__create_issue": "allow",
              "mcp__github__list_issues": "allow",
              "mcp__github__search_issues": "allow",
              "mcp__github__delete_repo": "deny",
              "mcp__jira__jira_create_issue": "allow",
              "mcp__jira__jira_ls_issues": "allow",
              "mcp__jira__jira_get_issue": "allow",
              "mcp__slack__slack_post_message": "allow",
              "mcp__slack__slack_list_channels": "allow"
            }
          }
          PERMJSON

      - name: Test MCP connections
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cortex mcp list
          echo "---"
          cortex mcp start

      - name: Verify agent definitions
        run: |
          echo "Agents found in .cortex/agents/:"
          ls -1 .cortex/agents/

      - name: Run data quality inspection
        continue-on-error: true
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cortex exec "Profile all tables in FINANCE_DEMO.RAW and write your findings to reports/data_quality_report.md" \
            --agent data-quality-inspector \
            -c default \
            --bypass \
            --model claude-sonnet-4-5 \
            --max-turns 30 \
            --no-history
        timeout-minutes: 10

      - name: Run dbt optimization review
        continue-on-error: true
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cortex exec "Review the dbt project in finance_warehouse/ and write your findings to reports/dbt_optimization_report.md" \
            --agent dbt-optimizer \
            -c default \
            --bypass \
            --model claude-sonnet-4-5 \
            --max-turns 30 \
            --no-history
        timeout-minutes: 10

      - name: Run RBAC audit
        continue-on-error: true
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cortex exec "Audit all Snowflake roles and access grants, then write your findings to reports/rbac_audit_report.md" \
            --agent rbac-auditor \
            -c default \
            --bypass \
            --model claude-sonnet-4-5 \
            --max-turns 30 \
            --no-history
        timeout-minutes: 10

      - name: Run FinOps analysis
        continue-on-error: true
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cortex exec "Analyze credit consumption for the last 30 days and write your findings to reports/finops_report.md" \
            --agent finops-analyst \
            -c default \
            --bypass \
            --model claude-sonnet-4-5 \
            --max-turns 30 \
            --no-history
        timeout-minutes: 10

      - name: Route findings to GitHub, Jira, and Slack
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cortex exec "Read all report files in the reports/ directory and route the findings to GitHub Issues, Jira tickets, and Slack based on severity. Use the MCP tools available to you. Follow the routing rules in your system prompt. Write a routing log to reports/issue_routing_log.md" \
            --agent issue-router \
            -c default \
            --bypass \
            --model claude-sonnet-4-5 \
            --max-turns 40 \
            --no-history \
            -o reports/swarm_summary.md
        timeout-minutes: 15

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: health-check-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Commit updated reports
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "chore: update health check reports [skip ci]"
            git push
          fi