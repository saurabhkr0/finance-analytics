version: 2

sources:
  - name: finance_raw
    database: FINANCE_DEMO
    schema: RAW
    description: Raw finance data ingested from upstream operational systems.
    freshness:
      warn_after:
        count: 24
        period: hour
      error_after:
        count: 48
        period: hour

    tables:
      - name: CUSTOMERS
        description: Customer master data including demographics, risk profile, and AUM.
        loaded_at_field: ONBOARDING_DATE
        columns:
          - name: CUSTOMER_ID
            description: Unique identifier for each customer.
          - name: RISK_RATING
            description: "KYC risk classification: High, Medium, or Low."
          - name: ACCOUNT_STATUS
            description: "Current account lifecycle status: Active, Inactive, Dormant, or Closed."
          - name: ONBOARDING_DATE
            description: Date the customer was onboarded.
          - name: TOTAL_AUM
            description: Total assets under management for the customer in base currency.
          - name: CLIENT_SEGMENT
            description: "Customer segment: Retail, HNWI, UHNWI, or Institutional."

      - name: TRANSACTIONS
        description: Financial transaction records across all account types and business lines.
        loaded_at_field: TRANSACTION_DATE
        columns:
          - name: TRANSACTION_ID
            description: Source system transaction identifier (not unique on its own).
          - name: TRANSACTION_DATE
            description: Date the transaction was executed.
          - name: ACCOUNT_TYPE
            description: "Account type for the transaction: Checking, Savings, Credit Card, Brokerage, or Loan."
          - name: TRANSACTION_TYPE
            description: "Type of transaction: Deposit, Withdrawal, Transfer, Wire, ACH, Check, ATM, Fee, Interest, or Dividend."
          - name: AMOUNT
            description: Transaction amount in the original currency.
          - name: CURRENCY
            description: "ISO currency code: USD, EUR, GBP, JPY, or CHF."
          - name: BRANCH_CITY
            description: City of the branch where the transaction was processed.
          - name: BUSINESS_LINE
            description: "Business line: Retail, Private Banking, Wealth Mgmt, or Institutional."
          - name: CUSTOMER_ID
            description: Foreign key to the customer who executed the transaction.

      - name: COMPLIANCE_ALERTS
        description: AML and compliance alerts generated by the monitoring system.
        loaded_at_field: ALERT_DATE
        columns:
          - name: ALERT_ID
            description: Source system alert identifier (not unique on its own).
          - name: ALERT_DATE
            description: Date the alert was raised.
          - name: CUSTOMER_ID
            description: Foreign key to the customer associated with the alert.
          - name: ALERT_TYPE
            description: "Alert category: Sanctions Match, Structuring, Large Cash, Velocity, Geo Anomaly, or Unusual Pattern."
          - name: STATUS
            description: "Current alert status: Open, Under Review, Escalated, Closed - SAR Filed, or Closed - No Action."
          - name: SEVERITY
            description: "Alert severity level: Critical, High, Medium, or Low."
